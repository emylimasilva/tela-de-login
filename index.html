<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login e Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <!-- CABEÇALHO -->
            <div class="header">
                <h1>Bem-vindo!</h1>
                <p class="subtitle">Gerenciador de Usuários</p>
            </div>

            <!-- ABAS (LOGIN / CADASTRO) -->
            <div class="tabs">
                <button class="tab-button active" onclick="mostrarAba('login')">Login</button>
                <button class="tab-button" onclick="mostrarAba('cadastro')">Cadastro</button>
            </div>

            <!-- ABA LOGIN -->
            <div id="login" class="tab-content active">
                <h2>Entrar na sua conta</h2>
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginEmail">Email:</label>
                        <input 
                            type="email" 
                            id="loginEmail" 
                            name="email" 
                            placeholder="seu@email.com" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Senha:</label>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            name="password" 
                            placeholder="••••••••" 
                            required
                        >
                    </div>

                    <button type="submit" class="btn-primary">Entrar</button>
                </form>
                <div id="loginMessage" class="message"></div>
            </div>

            <!-- ABA CADASTRO -->
            <div id="cadastro" class="tab-content">
                <h2>Criar nova conta</h2>
                <form id="cadastroForm" onsubmit="handleCadastro(event)">
                    <div class="form-group">
                        <label for="cadastroNome">Nome Completo:</label>
                        <input 
                            type="text" 
                            id="cadastroNome" 
                            name="nome" 
                            placeholder="Seu Nome" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="cadastroEmail">Email:</label>
                        <input 
                            type="email" 
                            id="cadastroEmail" 
                            name="email" 
                            placeholder="seu@email.com" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="cadastroPassword">Senha:</label>
                        <input 
                            type="password" 
                            id="cadastroPassword" 
                            name="password" 
                            placeholder="••••••••" 
                            minlength="6"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="cadastroConfirm">Confirmar Senha:</label>
                        <input 
                            type="password" 
                            id="cadastroConfirm" 
                            name="confirm" 
                            placeholder="••••••••" 
                            required
                        >
                    </div>

                    <button type="submit" class="btn-primary">Cadastrar</button>
                </form>
                <div id="cadastroMessage" class="message"></div>
            </div>

            <!-- ÁREA DE USUÁRIOS CADASTRADOS (para teste) -->
            <div class="usuarios-section">
                <h3>Usuários Cadastrados (LocalStorage):</h3>
                <div id="usuariosList" class="usuarios-list">
                    <p class="empty">Nenhum usuário cadastrado ainda...</p>
                </div>
                <button onclick="limparLocalStorage()" class="btn-secondary">Limpar Dados</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="models/Usuario.js"></script>
    <script src="app.js"></script>
</body>
</html>
